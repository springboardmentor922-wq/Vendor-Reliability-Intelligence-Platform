<ng-container *ngIf="auth.isAuthenticated(); else authOnly">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand navbar-brand-vendoriq" routerLink="/dashboard">
        <i class="fa-solid fa-boxes-stacked me-2"></i>VendorIQ
      </a>
      <div class="d-flex align-items-center ms-auto">
        <span class="text-muted small me-3 d-none d-md-inline">
          {{ auth.currentUser()?.full_name }}
          <span class="badge bg-secondary ms-1">{{ auth.currentUser()?.role }}</span>
        </span>
        <button class="btn btn-outline-danger btn-sm" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-12 col-md-3 col-lg-2 sidebar py-3 px-2">
        <ul class="nav flex-column">
          <li class="nav-item" *ngFor="let item of navItems">
            <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
              <i class="fa-solid {{ item.icon }} me-2"></i>{{ item.label }}
            </a>
          </li>
        </ul>
      </aside>
      <main class="col-12 col-md-9 col-lg-10 py-4">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-container>

<ng-template #authOnly>
  <router-outlet></router-outlet>
</ng-template>
