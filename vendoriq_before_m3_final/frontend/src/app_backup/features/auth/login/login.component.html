<div class="d-flex align-items-center justify-content-center bg-grad-1" style="min-height: 100vh;">
  <div class="card card-elevated p-4" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-3">
      <i class="fa-solid fa-boxes-stacked fa-2x text-primary"></i>
      <h4 class="mt-2 page-title">VendorIQ</h4>
      <p class="text-muted small mb-0">Vendor Reliability Intelligence &amp; Procurement Risk Management</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="you@company.com" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-brand w-100" [disabled]="form.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Sign in
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
    <p class="text-center text-muted small mt-2 mb-0">
      Default admin: admin&#64;vendoriq.com / Admin&#64;123
    </p>
  </div>
</div>
