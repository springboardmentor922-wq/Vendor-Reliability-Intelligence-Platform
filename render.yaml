services:
  # FastAPI Backend Web Service
  - type: web
    name: vendoriq-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vendoriq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vendoriq-redis
          property: connectionString

  # Angular Frontend Web Service
  - type: web
    name: vendoriq-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile

  # Managed Redis Instance
  - type: redis
    name: vendoriq-redis
    plan: free
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: vendoriq-db
    databaseName: vendoriq
    user: vendoriq_user
    plan: free

