<div class="auth-wrapper">
  <div class="auth-card-wide shadow-lg" style="max-width: 520px;">
    <div class="card-header-iq">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-logo-small">
          <i class="bi bi-key-fill"></i>
        </div>
        <div>
          <h2 class="m-0 fw-bold fs-5">Reset Account Password</h2>
          <p class="text-muted m-0 small">Secure recovery workflow</p>
        </div>
      </div>
      <a routerLink="/login" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </a>
    </div>

    <div class="card-body-iq">
      <div *ngIf="errorMessage" class="alert alert-danger py-2 d-flex align-items-center gap-2 small">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="alert alert-success py-2 d-flex align-items-center gap-2 small">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Step 1: Request Token -->
      <div *ngIf="step === 'request'">
        <p class="text-muted small mb-3">
          Enter your registered email address below. The system will generate a secure reset token to verify your identity.
        </p>

        <form (ngSubmit)="requestResetToken()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Corporate Email</label>
            <input
              type="email"
              class="form-control iq-input-simple"
              [(ngModel)]="email"
              name="email"
              placeholder="e.g. procurement@vendor-iq.com"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Generate Reset Token
          </button>
        </form>
      </div>

      <!-- Step 2: Enter New Password -->
      <div *ngIf="step === 'reset'">
        <div *ngIf="generatedToken" class="alert alert-info py-2 small mb-3">
          <strong>Your Reset Token:</strong> <code>{{ generatedToken }}</code>
        </div>

        <form (ngSubmit)="submitNewPassword()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Verification Token</label>
            <input
              type="text"
              class="form-control iq-input-simple"
              [(ngModel)]="token"
              name="token"
              placeholder="Paste token here"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input
              type="password"
              class="form-control iq-input-simple"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="Minimum 6 characters"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input
              type="password"
              class="form-control iq-input-simple"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter new password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Update Password & Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
