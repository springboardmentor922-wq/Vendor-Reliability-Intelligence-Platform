<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VendorIQ | Vendor Reliability Intelligence</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #ef3b2d;
            --primary-dark: #d92f24;
            --dark: #17191d;
            --dark-2: #202328;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #182230;
            --muted: #718096;
            --border: #e3e7ed;
            --success: #20a05a;
            --warning: #d88a00;
            --danger: #e53935;
            --blue: #2563eb;
            --shadow: 0 10px 30px rgba(20, 30, 50, 0.08);
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 265px;
            background: var(--dark);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: 0.3s ease;
        }

        .logo {
            padding: 34px 32px 25px;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .menu-title {
            padding: 15px 34px;
            color: #8c929d;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .nav {
            padding: 0 20px;
        }

        .nav button {
            width: 100%;
            border: 0;
            background: transparent;
            color: #d9dde3;
            padding: 14px 15px;
            margin: 3px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            text-align: left;
            transition: 0.25s ease;
        }

        .nav button:hover {
            background: #292d33;
            transform: translateX(4px);
            color: white;
        }

        .nav button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(239, 59, 45, 0.3);
        }

        .nav-icon {
            width: 25px;
            text-align: center;
            font-size: 17px;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 20px 34px 30px;
            border-top: 1px solid #34373c;
        }

        .profile-name {
            font-weight: 700;
            font-size: 14px;
        }

        .profile-role {
            color: #89909a;
            font-size: 12px;
            margin-top: 4px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 265px;
            width: calc(100% - 265px);
            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px;
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .breadcrumb {
            color: var(--muted);
            font-size: 14px;
        }

        .breadcrumb strong {
            color: var(--text);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 10px;
            transition: 0.2s;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--dark);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 800;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            padding: 34px;
            animation: pageIn 0.4s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 34px;
            font-weight: 850;
            letter-spacing: -1px;
        }

        .page-subtitle {
            color: var(--muted);
            margin-top: 7px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn {
            border: 0;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 7px 18px rgba(239, 59, 45, 0.22);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-blue {
            background: #e8efff;
            color: #1d4ed8;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            border-radius: 20px;
            padding: 35px;
            color: white;
            background:
                radial-gradient(circle at 90% 10%, rgba(239,59,45,.55), transparent 25%),
                linear-gradient(120deg, #181b20, #392324);
            min-height: 205px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: heroIn 0.6s ease;
        }

        @keyframes heroIn {
            from {
                opacity: 0;
                transform: scale(.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero::after {
            content: "";
            width: 180px;
            height: 180px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
            position: absolute;
            right: 100px;
            bottom: -100px;
            animation: rotateCircle 8s linear infinite;
        }

        @keyframes rotateCircle {
            to {
                transform: rotate(360deg);
            }
        }

        .hero-small {
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #c8cbd0;
            font-weight: 800;
        }

        .hero h1 {
            font-size: 34px;
            margin: 14px 0 10px;
        }

        .hero p {
            color: #c6cbd2;
        }

        .live {
            display: inline-flex;
            margin-top: 20px;
            padding: 8px 13px;
            border-radius: 30px;
            background: rgba(255,255,255,.1);
            font-size: 13px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39d98a;
            margin: auto 7px auto 0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .3;
                transform: scale(.7);
            }
        }

        /* =========================
           CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #f0f2f5;
            display: grid;
            place-items: center;
            margin-bottom: 17px;
            font-size: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
            letter-spacing: .8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 850;
            margin-top: 8px;
        }

        .green {
            color: var(--success);
        }

        .orange {
            color: var(--warning);
        }

        .red {
            color: var(--danger);
        }

        .blue {
            color: var(--blue);
        }

        .stat-description {
            color: #8993a0;
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           GRID
        ========================= */

        .two-column {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            margin-top: 22px;
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            padding: 22px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 19px;
            font-weight: 800;
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .card-body {
            padding: 22px;
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-row {
            margin-bottom: 22px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .progress {
            height: 10px;
            background: #edf0f3;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background: var(--success);
            transition: width 1s ease;
        }

        .progress-bar.orange-bar {
            background: var(--warning);
        }

        .progress-bar.red-bar {
            background: var(--danger);
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            background: white;
            border: 1px solid var(--border);
            padding: 17px;
            border-radius: 13px;
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 230px;
            position: relative;
        }

        .search input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
        }

        .search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(239,59,45,.1);
        }

        .search span {
            position: absolute;
            left: 14px;
            top: 12px;
        }

        select {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            outline: none;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background: #fafbfc;
            color: #667085;
            padding: 15px 18px;
            font-size: 11px;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        td {
            padding: 17px 18px;
            border-top: 1px solid #edf0f3;
            font-size: 14px;
        }

        tr {
            transition: .2s;
        }

        tbody tr:hover {
            background: #fafbfc;
        }

        .vendor-id {
            color: var(--primary);
            font-weight: 800;
        }

        .vendor-name {
            font-weight: 750;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
        }

        .status-active {
            background: #e5f7ed;
            color: #16854b;
        }

        .status-pending {
            background: #fff4d8;
            color: #a96900;
        }

        .status-suspended {
            background: #fee5e5;
            color: #c92828;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 0;
            background: transparent;
            font-weight: 700;
            padding: 5px;
        }

        .view-btn {
            color: var(--primary);
        }

        .edit-btn {
            color: var(--blue);
        }

        .delete-btn {
            color: var(--danger);
        }

        /* =========================
           MODULE CARDS
        ========================= */

        .module-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .module-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: .25s;
        }

        .module-card:hover {
            transform: translateY(-5px);
        }

        .module-icon {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .module-card h3 {
            margin-bottom: 7px;
        }

        .module-card p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, .65);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn .2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 17px;
            animation: modalIn .25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-size: 23px;
        }

        .close {
            border: 0;
            background: transparent;
            font-size: 25px;
            color: #667085;
        }

        .modal-body {
            padding: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 750;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .modal-footer {
            padding: 18px 25px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =========================
           LOADING
        ========================= */

        .loader {
            width: 25px;
            height: 25px;
            border: 3px solid #ddd;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        .error-box {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #ffd0d0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #202328;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            transform: translateY(100px);
            opacity: 0;
            transition: .3s;
            z-index: 7000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 1000px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .two-column {
                grid-template-columns: 1fr;
            }

            .module-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 750px) {
            .sidebar {
                width: 75px;
            }

            .logo {
                padding: 25px 15px;
                font-size: 20px;
            }

            .menu-title,
            .nav button span:not(.nav-icon),
            .sidebar-bottom {
                display: none;
            }

            .nav {
                padding: 0 10px;
            }

            .nav button {
                justify-content: center;
                padding: 14px 5px;
            }

            .main {
                margin-left: 75px;
                width: calc(100% - 75px);
            }

            .content {
                padding: 20px;
            }

            .page-header {
                flex-direction: column;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .module-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            Vendor<span>IQ</span>
        </div>

        <div class="menu-title">
            MAIN MENU
        </div>

        <nav class="nav">

            <button class="nav-btn active" data-page="dashboard">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </button>

            <button class="nav-btn" data-page="vendors">
                <span class="nav-icon">▣</span>
                <span>Vendors</span>
            </button>

            <button class="nav-btn" data-page="procurement">
                <span class="nav-icon">▤</span>
                <span>Procurement</span>
            </button>

            <button class="nav-btn" data-page="purchase-orders">
                <span class="nav-icon">▥</span>
                <span>Purchase Orders</span>
            </button>

            <button class="nav-btn" data-page="performance">
                <span class="nav-icon">◈</span>
                <span>Performance</span>
            </button>

            <button class="nav-btn" data-page="analytics">
                <span class="nav-icon">◔</span>
                <span>Analytics</span>
            </button>

            <button class="nav-btn" data-page="contracts">
                <span class="nav-icon">▱</span>
                <span>Contracts</span>
            </button>

            <button class="nav-btn" data-page="reports">
                <span class="nav-icon">▧</span>
                <span>Reports</span>
            </button>

            <button class="nav-btn" data-page="notifications">
                <span class="nav-icon">♢</span>
                <span>Notifications</span>
            </button>

        </nav>

        <div class="sidebar-bottom">
            <div class="profile-name">A. Okonkwo</div>
            <div class="profile-role">Procurement Lead</div>
        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <header class="topbar">

            <div class="breadcrumb">
                VendorIQ /
                <strong id="breadcrumb">Dashboard</strong>
            </div>

            <div class="top-actions">

                <button class="icon-button"
                        onclick="openNotifications()"
                        title="Notifications">
                    🔔
                </button>

                <div class="avatar">
                    AO
                </div>

            </div>

        </header>


        <section class="content" id="content">

        </section>

    </main>

</div>


<!-- =========================
     VENDOR MODAL
========================== -->

<div class="modal-overlay" id="vendorModal">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle">
                    Add New Vendor
                </h2>

                <p style="color:#718096;margin-top:5px;">
                    Register a vendor in VendorIQ
                </p>
            </div>

            <button class="close" onclick="closeVendorModal()">
                ×
            </button>

        </div>

        <form id="vendorForm">

            <div class="modal-body">

                <input type="hidden" id="vendorId">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Vendor Name *</label>

                        <input
                            id="vendorName"
                            required
                            placeholder="Enter vendor name">
                    </div>


                    <div class="form-group">
                        <label>Category *</label>

                        <select id="vendorCategory" required>

                            <option value="">
                                Select category
                            </option>

                            <option>
                                IT Services
                            </option>

                            <option>
                                Industrial Supplies
                            </option>

                            <option>
                                Manufacturing
                            </option>

                            <option>
                                Logistics
                            </option>

                            <option>
                                Raw Material Suppliers
                            </option>

                            <option>
                                Equipment Vendors
                            </option>

                            <option>
                                Service Providers
                            </option>

                        </select>

                    </div>


                    <div class="form-group">
                        <label>Email</label>

                        <input
                            id="vendorEmail"
                            type="email"
                            placeholder="vendor@example.com">
                    </div>


                    <div class="form-group">
                        <label>Phone</label>

                        <input
                            id="vendorPhone"
                            placeholder="9876543210">
                    </div>


                    <div class="form-group">
                        <label>Status</label>

                        <select id="vendorStatus">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Suspended">
                                Suspended
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>Address</label>

                        <textarea
                            id="vendorAddress"
                            placeholder="Enter vendor address"></textarea>

                    </div>

function navigate(page) {

/* =====================================
   API HELPER
===================================== */

async function apiRequest(
    endpoint,
    options = {}
) {

    const response = await fetch(
        API + endpoint,
        options
    );

    if (!response.ok) {

        let message = "API request failed";

        try {

            const error = await response.json();

            message =
                error.detail ||
                JSON.stringify(error);

        } catch {}

        throw new Error(message);

    }

    return response.json();

}

function progress(

    value,

    if (type === "red") {

    }

    return `

        <div class="progress-row">

            <div class="progress-info">

                <span>
                    ${label}
                </span>

                <span>
                    ${percent}%
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar ${cls}"
                    style="width:${percent}%">
                </div>

            </div>

        </div>

    `;

}

function filterVendors() {

    const search =
        (
            document.getElementById(
                "vendorSearch"
            )?.value || ""
        )
        .toLowerCase()
        .trim();

    const status =
        document.getElementById(
            "statusFilter"
        )?.value || "";

    const category =
        document.getElementById(
            "categoryFilter"
        )?.value || "";


    const filtered =
        vendors.filter(v => {

            const searchable =
                `${v.id || ""}
                 ${v.vendor_name || ""}
                 ${v.category || ""}
                 ${v.email || ""}
                 ${v.phone || ""}
                 ${v.address || ""}`
                .toLowerCase();

            const matchesSearch =
                !search ||
                searchable.includes(search);

            const matchesStatus =
                !status ||
                normalizeStatus(v.status) === status;

            const matchesCategory =
                !category ||
                v.category === category;

            return (
                matchesSearch &&
                matchesStatus &&
                matchesCategory
            );

        });


    document.getElementById(
        "vendorCount"
    ).textContent =
        `${filtered.length} of ${vendors.length} vendors`;


    const table =
        document.getElementById(
            "vendorTable"
        );


    if (!filtered.length) {

        table.innerHTML = `

            <tr>

                <td colspan="8"
                    class="message">

                    No vendors found.

                </td>

            </tr>

        return;

    }


    table.innerHTML =
        filtered.map(
            vendorRow

        normalizeStatus(v.status);

    let statusClass =

    return `

            <td class="vendor-name">
                ${escapeHTML(v.vendor_name)}

            <td>

            </td>

            <td>
                ${escapeHTML(v.email || "-")}
            </td>

            <td>
                ${escapeHTML(
                    v.address || "-"
                )}
            </td>

            <td>
                ${escapeHTML(
                    v.phone || "-"
                )}
            </td>

            <td>

                    ${escapeHTML(
                        v.status || "Active"

    `;

}

===================================== */

document.getElementById(
    "vendorForm"
).addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const id =
            document.getElementById(
                "vendorId"
            ).value;


        const data = {

            vendor_name:
                document.getElementById(
                    "vendorName"
                ).value.trim(),

            category:
                document.getElementById(
                    "vendorCategory"
                ).value,

            email:
                document.getElementById(
                    "vendorEmail"
                ).value.trim() || null,

            phone:
                document.getElementById(
                    "vendorPhone"
                ).value.trim() || null,

            address:
                document.getElementById(
                    "vendorAddress"
                ).value.trim() || null,

            status:
                document.getElementById(
                    "vendorStatus"
                ).value

        };


        try {

            if (id) {

                await apiRequest(
                    `/vendors/${id}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

                showToast(
                    "Vendor updated successfully"
                );

            } else {

                await apiRequest(
                    "/vendors/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

                showToast(
                    "Vendor added successfully"
                );

            }


            closeVendorModal();

            renderVendors();


        } catch (error) {

            showToast(
                "Error: " + error.message
            );

        }

    }
);

function viewVendor(id) {

    const vendor =
        vendors.find(
            v => Number(v.id) === Number(id)
        );

    if (!vendor) return;


    alert(

        `Vendor Details\n\n` +

        `ID: V-${String(vendor.id).padStart(4,"0")}\n` +

        `Name: ${vendor.vendor_name}\n` +

        `Category: ${vendor.category}\n` +

        `Email: ${vendor.email || "-"}\n` +

        `Phone: ${vendor.phone || "-"}\n` +

        `Address: ${vendor.address || "-"}\n` +

        `Status: ${vendor.status}`

    );

}


/* =====================================
   DELETE VENDOR
===================================== */

async function deleteVendor(id) {

    const vendor =
        vendors.find(
            v => Number(v.id) === Number(id)
        );

    if (!vendor) return;


    const confirmed =
        confirm(
            `Delete vendor "${vendor.vendor_name}"?`
        );

    if (!confirmed) return;


    try {

        await apiRequest(
            `/vendors/${id}`,
            {
                method: "DELETE"
            }
        );

        showToast(
            "Vendor deleted successfully"
        );

        renderVendors();

    } catch (error) {

        showToast(
            "Delete failed: " +
            error.message
        );

    }

}

        </div>


        <div class="card">

            <div class="card-header">

                <div class="card-title">
                    ${title} Directory
                </div>

                <div class="card-subtitle">
                    Live data from FastAPI
                </div>

            </div>

            <div class="card-body"
                 id="apiModule">

                <div class="loader"></div>

            </div>

        </div>

    `;


    try {

        const data =
            await apiRequest(endpoint);

        renderGenericData(data);


    } catch (error) {

        document.getElementById(
            "apiModule"
        ).innerHTML =
            errorBox(error);

    }

}


function renderGenericData(data) {

    const container =
        document.getElementById(
            "apiModule"
        );

    if (!container) return;


    if (!Array.isArray(data)) {

        container.innerHTML = `

            <pre style="
                white-space:pre-wrap;
                line-height:1.6;
                background:#f7f8fa;
                padding:20px;
                border-radius:10px;
            ">${escapeHTML(
                JSON.stringify(
                    data,
                    null,
                    2
                )
            )}</pre>

        `;

        return;

    }


    if (!data.length) {

        container.innerHTML = `

            <div class="message">
                No records available.
            </div>

        `;

        return;

    }


    const keys =
        Object.keys(data[0]);


    container.innerHTML = `

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        ${keys.map(
                            key => `
                                <th>
                                    ${escapeHTML(
                                        key.replaceAll(
                                            "_",
                                            " "
                                        )
                                    )}
                                </th>
                            `
                        ).join("")}

                    </tr>

                </thead>

                <tbody>

                    ${data.map(row => `

                        <tr>

                            ${keys.map(
                                key => `
                                    <td>
                                        ${escapeHTML(
                                            formatValue(
                                                row[key]
                                            )
                                        )}
                                    </td>
                                `
                            ).join("")}

                        </tr>

                    `).join("")}

                </tbody>

            </table>

        </div>

    `;

}


/* =====================================

===================================== */

let procurementRequests = [];

async function renderProcurement() {
    const content = document.getElementById("content");

    content.innerHTML = `
        <div class="page-header">
            <div>
                <div class="page-title">📦 Procurement Requests</div>
                <div class="page-subtitle">Manage procurement requests, approvals and vendor assignment</div>
            </div>
            <div class="header-buttons">
                <button class="btn btn-secondary" onclick="renderProcurement()">↻ Refresh</button>
                <button class="btn btn-primary" onclick="openAddProcurement()">+ New Request</button>
            </div>
        </div>

        <div class="stats" id="procurementStats">
            ${loadingCard()}${loadingCard()}${loadingCard()}${loadingCard()}
        </div>

        <div class="card" style="margin-top:22px;">
            <div class="card-header">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;">
                    <div>
                        <div class="card-title">Procurement Request Directory</div>
                        <div class="card-subtitle">Live procurement request data from FastAPI</div>
                    </div>
                    <strong id="procurementCount">Loading...</strong>
                </div>
            </div>
            <div class="card-body">
                <div class="toolbar">
                    <div class="search">
                        <span>🔍</span>
                        <input id="procurementSearch" placeholder="Search request, item, vendor or requester..." oninput="filterProcurement()">
                    </div>
                    <select id="procurementStatusFilter" onchange="filterProcurement()">
                        <option value="">All statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Ordered">Ordered</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Request</th>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Est. Cost</th>
                                <th>Required Date</th>
                                <th>Requested By</th>
                                <th>Vendor</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="procurementTable">
                            <tr><td colspan="9"><div class="loader"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    try {
        const data = await apiRequest("/procurement-requests/");
        procurementRequests = Array.isArray(data) ? data : [];
        updateProcurementStats();
        filterProcurement();
    } catch (error) {
        document.getElementById("procurementTable").innerHTML = `
            <tr><td colspan="9">${errorBox(error)}</td></tr>
        `;
        document.getElementById("procurementCount").textContent = "0 requests";
        updateProcurementStats();
    }
}

function procurementValue(v, keys, fallback = "") {
    for (const key of keys) {
        if (v[key] !== undefined && v[key] !== null && v[key] !== "") return v[key];
    }
    return fallback;
}

function updateProcurementStats() {
    const total = procurementRequests.length;
    const pending = procurementRequests.filter(v => String(procurementValue(v,["status"])).toLowerCase() === "pending").length;
    const approved = procurementRequests.filter(v => String(procurementValue(v,["status"])).toLowerCase() === "approved").length;
    const completed = procurementRequests.filter(v => String(procurementValue(v,["status"])).toLowerCase() === "completed").length;
    const stats = document.getElementById("procurementStats");
    if (!stats) return;
    stats.innerHTML = `
        <div class="stat-card"><div class="stat-label">TOTAL REQUESTS</div><div class="stat-value">${total}</div><div class="stat-description">All procurement requests</div></div>
        <div class="stat-card"><div class="stat-label">PENDING</div><div class="stat-value orange">${pending}</div><div class="stat-description">Requires approval</div></div>
        <div class="stat-card"><div class="stat-label">APPROVED</div><div class="stat-value blue">${approved}</div><div class="stat-description">Ready for ordering</div></div>
        <div class="stat-card"><div class="stat-label">COMPLETED</div><div class="stat-value green">${completed}</div><div class="stat-description">Completed requests</div></div>
    `;
}

function filterProcurement() {
    const search = (document.getElementById("procurementSearch")?.value || "").toLowerCase().trim();
    const status = (document.getElementById("procurementStatusFilter")?.value || "").toLowerCase();
    const filtered = procurementRequests.filter(v => {
        const text = [
            procurementValue(v,["id","request_id","procurement_request_id"]),
            procurementValue(v,["item","item_name","description"]),
            procurementValue(v,["vendor","vendor_name"]),
            procurementValue(v,["requested_by","requester","requester_name"]),
            procurementValue(v,["status"])
        ].join(" ").toLowerCase();
        return (!search || text.includes(search)) &&
               (!status || String(procurementValue(v,["status"])).toLowerCase() === status);
    });

    const count = document.getElementById("procurementCount");
    if (count) count.textContent = `${filtered.length} of ${procurementRequests.length} requests`;

    const table = document.getElementById("procurementTable");
    if (!table) return;
    if (!filtered.length) {
        table.innerHTML = `<tr><td colspan="9" class="message">No procurement requests found.</td></tr>`;
        return;
    }
    table.innerHTML = filtered.map(procurementRow).join("");
}

function procurementRow(v) {
    const id = procurementValue(v,["id","request_id","procurement_request_id"], "-");
    const item = procurementValue(v,["item","item_name","description"], "-");
    const qty = procurementValue(v,["quantity","qty"], "-");
    const cost = procurementValue(v,["estimated_cost","est_cost","cost","amount"], "-");
    const date = procurementValue(v,["required_date","needed_by","delivery_date"], "-");
    const requester = procurementValue(v,["requested_by","requester","requester_name"], "-");
    const vendor = procurementValue(v,["vendor","vendor_name"], "-");
    const status = procurementValue(v,["status"], "Pending");
    const normalized = String(status).toLowerCase();
    const cls = normalized === "pending" ? "status-pending" : normalized === "suspended" || normalized === "cancelled" ? "status-suspended" : "status-active";
    return `
        <tr>
            <td class="vendor-id">PR-${String(id).replace(/^PR-/,"").padStart(4,"0")}</td>
            <td class="vendor-name">${escapeHTML(item)}</td>
            <td>${escapeHTML(qty)}</td>
            <td>${escapeHTML(cost)}</td>
            <td>${escapeHTML(date)}</td>
            <td>${escapeHTML(requester)}</td>
            <td>${escapeHTML(vendor)}</td>
            <td><span class="status ${cls}">${escapeHTML(status)}</span></td>
            <td><div class="action-buttons">
                <button class="action-btn view-btn" onclick="viewProcurement(${JSON.stringify(id)})">View</button>
                <button class="action-btn edit-btn" onclick="openEditProcurement(${JSON.stringify(id)})">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteProcurement(${JSON.stringify(id)})">Delete</button>
            </div></td>
        </tr>
    `;
}

function findProcurement(id) {
    return procurementRequests.find(v => String(procurementValue(v,["id","request_id","procurement_request_id"])) === String(id));
}

function openAddProcurement() {
    document.getElementById("procurementForm").reset();
    document.getElementById("procurementId").value = "";
    document.getElementById("procurementModalTitle").textContent = "New Procurement Request";
    document.getElementById("procurementStatus").value = "Pending";
    document.getElementById("procurementModal").classList.add("show");
}

function openEditProcurement(id) {
    const v = findProcurement(id);
    if (!v) return showToast("Procurement request not found");
    document.getElementById("procurementId").value = id;
    document.getElementById("procurementItem").value = procurementValue(v,["item","item_name","description"],"");
    document.getElementById("procurementQuantity").value = procurementValue(v,["quantity","qty"],"");
    document.getElementById("procurementCost").value = procurementValue(v,["estimated_cost","est_cost","cost","amount"],"");
    document.getElementById("procurementDate").value = String(procurementValue(v,["required_date","needed_by","delivery_date"],"")).slice(0,10);
    document.getElementById("procurementRequester").value = procurementValue(v,["requested_by","requester","requester_name"],"");
    document.getElementById("procurementVendor").value = procurementValue(v,["vendor","vendor_name"],"");
    document.getElementById("procurementStatus").value = procurementValue(v,["status"],"Pending");
    document.getElementById("procurementModalTitle").textContent = "Edit Procurement Request";
    document.getElementById("procurementModal").classList.add("show");
}

function closeProcurementModal() {
    document.getElementById("procurementModal")?.classList.remove("show");
}

function viewProcurement(id) {
    const v = findProcurement(id);
    if (!v) return showToast("Procurement request not found");
    alert(
        `Procurement Request\n\n` +
        `ID: ${procurementValue(v,["id","request_id","procurement_request_id"],"-")}\n` +
        `Item: ${procurementValue(v,["item","item_name","description"],"-")}\n` +
        `Quantity: ${procurementValue(v,["quantity","qty"],"-")}\n` +
        `Estimated Cost: ${procurementValue(v,["estimated_cost","est_cost","cost","amount"],"-")}\n` +
        `Required Date: ${procurementValue(v,["required_date","needed_by","delivery_date"],"-")}\n` +
        `Requested By: ${procurementValue(v,["requested_by","requester","requester_name"],"-")}\n` +
        `Vendor: ${procurementValue(v,["vendor","vendor_name"],"-")}\n` +
        `Status: ${procurementValue(v,["status"],"-")}`
    );
}

async function deleteProcurement(id) {
    const v = findProcurement(id);
    if (!v) return showToast("Procurement request not found");
    const name = procurementValue(v,["item","item_name","description"], id);
    if (!confirm(`Delete procurement request "${name}"?`)) return;
    try {
        await apiRequest(`/procurement-requests/${id}`, { method: "DELETE" });
        showToast("Procurement request deleted successfully");
        renderProcurement();
    } catch (error) {
        showToast("Delete failed: " + error.message);
    }
}

document.getElementById("procurementForm").addEventListener("submit", async event => {
    event.preventDefault();
    const id = document.getElementById("procurementId").value;
    const data = {
        item: document.getElementById("procurementItem").value.trim(),
        quantity: Number(document.getElementById("procurementQuantity").value),
        estimated_cost: Number(document.getElementById("procurementCost").value),
        required_date: document.getElementById("procurementDate").value || null,
        requested_by: document.getElementById("procurementRequester").value.trim() || null,
        vendor: document.getElementById("procurementVendor").value.trim() || null,
        status: document.getElementById("procurementStatus").value
    };
    try {
        if (id) {
            await apiRequest(`/procurement-requests/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            showToast("Procurement request updated successfully");
        } else {
            await apiRequest("/procurement-requests/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            showToast("Procurement request added successfully");
        }
        closeProcurementModal();
        renderProcurement();
    } catch (error) {
        showToast("Error: " + error.message);
    }
});

document.getElementById("procurementModal").addEventListener("click", event => {
    if (event.target.id === "procurementModal") closeProcurementModal();
});

/* =====================================
   EXPORT
===================================== */

function exportVendors() {

    if (!vendors.length) {

        showToast(
            "No vendors to export"
        );

        return;

    }


    const headers = [
        "ID",
        "Vendor Name",
        "Category",
        "Email",
        "Phone",
        "Address",
        "Status"
    ];


    const rows =
        vendors.map(v => [

            v.id,

            v.vendor_name,

            v.category,

            v.email || "",

            v.phone || "",

            v.address || "",

            v.status || ""

        ]);


    const csv = [

        headers,

        ...rows

    ]
    .map(
        row =>
            row
                .map(
                    value =>
                        `"${String(value)
                            .replaceAll(
                                '"',
                                '""'
                            )}"`
                )
                .join(",")
    )
    .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "vendoriq-vendors.csv";

    a.click();

    URL.revokeObjectURL(
        url
    );


    showToast(
        "Vendor report exported"
    );

}


/* =====================================
   HELPERS
===================================== */

function normalizeStatus(status) {

    return String(
        status || ""
    )
    .toLowerCase()
    .trim();

}


function formatValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";

    }

    if (
        typeof value === "object"
    ) {

        return JSON.stringify(
            value
        );

    }

    return String(value);

}


function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function errorBox(error) {

    return `

        <div class="error-box">

            <strong>
                Unable to load data
            </strong>

            <br><br>

            ${escapeHTML(
                error.message ||
                "Unknown error"
            )}

        </div>

    `;

}


function showAPIError(
    elementId,
    error
) {

    const element =
        document.getElementById(
            elementId
        );

    if (!element) return;

    element.innerHTML =
        errorBox(error);

}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 3000);

}
