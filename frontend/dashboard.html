<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VendorIQ</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=rbac2">
</head>
<body>

    <div class="d-flex">
        <!-- Shared Sidebar Mount -->
        <div id="sidebarMount"></div>

        <!-- Main Content Area -->
        <div class="app-main">
            <!-- Shared Header Mount -->
            <div id="headerMount"></div>

            <div class="page-container" id="dashboardContentMount">
                <!-- Dynamically rendered based on User Role -->
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary me-2" role="status"></div> Loading role-customized dashboard...
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Dynamically invoked) -->
    <!-- Modal: Create New Purchase Order -->
    <div class="modal fade" id="newPOModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle text-primary me-2"></i>Create Purchase Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="createPOForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Order Title / Item Description</label>
                            <input type="text" class="form-control" id="poTitle" required placeholder="e.g. Q2 Raw Materials Supply - Batch A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Assign Verified Vendor</label>
                            <select class="form-select" id="poVendorSelect" required>
                                <option value="" disabled selected>Select an approved supplier...</option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Total Amount ($)</label>
                                <input type="number" step="0.01" class="form-control" id="poAmount" required placeholder="25000.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Expected Delivery Date</label>
                                <input type="date" class="form-control" id="poDeliveryDate" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="savePOBtn">Generate PO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js?v=rbac2"></script>
    <script src="js/api.js?v=rbac2"></script>
    <script src="js/navigation.js?v=rbac2"></script>

    <script>
        let chart1Instance = null;
        let chart2Instance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth();
            if (!user) return;

            renderSharedLayout('Dashboard');
            renderDashboardForRole(user.role);
            populateVendorDropdown();
        });

        async function renderDashboardForRole(role) {
            const mount = document.getElementById('dashboardContentMount');
            
            if (role === 'Vendor') {
                renderVendorDashboard(mount);
            } else if (role === 'Administrator') {
                renderAdminDashboard(mount);
            } else if (role === 'Finance Officer') {
                renderFinanceDashboard(mount);
            } else if (role === 'Supply Chain Manager') {
                renderSupplyChainDashboard(mount);
            } else if (role === 'Auditor') {
                renderAuditorDashboard(mount);
            } else {
                // Default: Procurement Manager
                renderProcurementDashboard(mount);
            }
        }

        // Workflow tracker neutralized to keep dashboards clean, spacious, and modern
        function renderWorkflowStepper(activeStage) {
            return '';
        }

        // ==========================================
        // 1. VENDOR DASHBOARD
        // ==========================================
        async function renderVendorDashboard(mount) {
            mount.innerHTML = `
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h3 class="fw-bold text-dark m-0 tracking-tight">Supplier Operations Portal</h3>
                            <span class="badge" style="background-color: #faeee4; color: #5c331d; border: 1px solid #ebdcd0;">Tier 1 Preferred Partner</span>
                        </div>
                        <p class="text-muted small m-0">Organization: <strong>Apex Logistics & Supply Co.</strong> • Review orders and submit delivery fulfillment updates.</p>
                    </div>
                    <div>
                        <a href="procurement.html" class="btn btn-primary btn-sm" style="border-radius: 8px;">
                            <i class="bi bi-box-seam me-1"></i> Update Deliveries
                        </a>
                    </div>
                </div>

                ${renderWorkflowStepper(3)}

                <div class="row g-3 mb-4">
                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">My Reliability Score</span>
                            <h2 class="fw-bold mt-1 mb-0" style="color: #ea580c;">94.5 / 100</h2>
                            <small style="color: #7c4a2d;"><i class="bi bi-star-fill" style="color: #ea580c;"></i> Top 5% across network</small>
                        </div>
                    </div>
                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">Assigned Orders</span>
                            <h2 class="fw-bold text-primary mt-1 mb-0">2 Orders</h2>
                            <small class="text-muted">1 In Fulfillment, 1 Verified</small>
                        </div>
                    </div>
                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">Delivery Accuracy</span>
                            <h2 class="fw-bold text-dark mt-1 mb-0">98.0%</h2>
                            <small style="color: #7c4a2d;">Zero return defect flags</small>
                        </div>
                    </div>
                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">Active Contract</span>
                            <h2 class="fw-bold text-dark mt-1 mb-0">CNT-2026-001</h2>
                            <small style="color: #7c4a2d;"><i class="bi bi-shield-check"></i> Compliant SLA</small>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-lg-8">
                        <div class="card-widget p-4 h-100">
                            <h5 class="fw-bold text-dark mb-1">My Performance Evaluation Breakdown</h5>
                            <small class="text-muted d-block mb-3">Automated scoring computed by VendorIQ Intelligence Engine</small>
                            <div style="height: 270px; position: relative;">
                                <canvas id="vendorPerfChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card-widget p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="fw-bold text-dark mb-1">Fulfillment Notice</h5>
                                <small class="text-muted d-block mb-3">Required actions for active shipments</small>
                                <div class="p-3 bg-light rounded-3 mb-3">
                                    <div class="fw-semibold text-dark small mb-1"><i class="bi bi-truck text-primary me-1"></i> PO-2026-102 In Transit</div>
                                    <div class="small text-muted">Express Material Transport - Batch B ($18,200.00). Expected in 7 days.</div>
                                </div>
                            </div>
                            <a href="procurement.html" class="btn btn-outline-primary w-100 btn-sm">
                                <i class="bi bi-upload me-1"></i> Submit Proof of Delivery

                        </div>
                    </div>
                </div>

                <div class="card-widget p-4">
                    <h5 class="fw-bold text-dark mb-3">Assigned Purchase Orders & Dispatch Queue</h5>
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>PO Number</th>
                                    <th>Order Title</th>
                                    <th>Expected Date</th>
                                    <th>Value</th>
                                    <th>Status</th>
                                    <th class="text-end">Fulfillment Action</th>
                                </tr>
                            </thead>
                            <tbody id="vendorOrdersTableBody">
                                <tr><td colspan="6" class="text-center py-4 text-muted">Loading assigned orders...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            try {
                const orders = await API.getOrders();
                const tbody = document.getElementById('vendorOrdersTableBody');
                if (tbody && orders && orders.length > 0) {
                    tbody.innerHTML = orders.map(o => {
                        let actionHtml = '';
                        if (o.status === 'Approved') {
                            actionHtml = `<a href="procurement.html" class="btn btn-sm btn-primary"><i class="bi bi-send me-1"></i>Dispatch</a>`;
                        } else if (o.status === 'Delivered') {
                            actionHtml = `<a href="procurement.html" class="btn btn-sm btn-primary"><i class="bi bi-receipt me-1"></i>Submit Invoice</a>`;
                        } else if (o.status === 'Ordered') {
                            actionHtml = `<span class="badge" style="background-color: #fff7ed; color: #c2410c; border: 1px solid #fed7aa;"><i class="bi bi-truck me-1"></i>In Transit</span>`;
                        } else if (o.status === 'Completed') {
                            actionHtml = `<span class="badge" style="background-color: #faeee4; color: #5c331d; border: 1px solid #ebdcd0;"><i class="bi bi-check2-all me-1"></i>Paid</span>`;
                        } else {
                            actionHtml = `<span class="badge bg-light text-muted border">${o.status}</span>`;
                        }

                        return `
                            <tr>
                                <td><strong class="text-primary">${o.order_number}</strong></td>
                                <td class="fw-semibold text-dark">${o.title}</td>
                                <td>${o.expected_delivery_date}</td>
                                <td class="fw-bold">$${o.total_amount.toLocaleString()}</td>
                                <td><span class="status-chip ${getStatusClass(o.status)}">${o.status}</span></td>
                                <td class="text-end">${actionHtml}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("Error loading vendor orders:", err);
            }

            // Render Radar / Bar Chart for Vendor
            setTimeout(() => {
                new Chart(document.getElementById('vendorPerfChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ['Delivery Accuracy', 'Product Quality', 'Response Time', 'Contract SLA', 'Reliability Index'],
                        datasets: [{
                            label: 'Your Rating (%)',
                            data: [98.0, 96.0, 92.5, 100.0, 94.5],
                            backgroundColor: '#ea580c',
                            hoverBackgroundColor: '#c2410c',
                            borderRadius: 8
                        }, {
                            label: 'Network Benchmark (%)',
                            data: [85.0, 80.0, 75.0, 90.0, 82.0],
                            backgroundColor: '#ebdcd0',
                            hoverBackgroundColor: '#dec7b7',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#4a3022',
                                    font: { family: 'Plus Jakarta Sans', weight: '600' }
                                }
                            }
                        },
                        scales: { 
                            x: {
                                ticks: { color: '#7c5c4a', font: { family: 'Plus Jakarta Sans' } },
                                grid: { display: false }
                            },
                            y: { 
                                min: 50, 
                                max: 100,
                                ticks: { color: '#7c5c4a', font: { family: 'Plus Jakarta Sans' } },
                                grid: { color: 'rgba(235, 220, 208, 0.6)' }
                            } 
                        }
                    }
                });
            }, 100);
        }

                                <tr><td><strong>procurement@vendoriq.com</strong></td><td>David Miller</td><td><span class="badge bg-primary">Procurement Manager</span></td><td><span class="status-chip delivered">Active</span></td><td>PO Creation & Approvals</td></tr>

        // ==========================================
        // 3. FINANCE OFFICER DASHBOARD
        // ==========================================
        async function renderFinanceDashboard(mount) {
            mount.innerHTML = `
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">

                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">Total Spend (YTD)</span>

                    </div>
                    <div class="col-xl-3 col-sm-6">

                    </div>
                    <div class="col-xl-3 col-sm-6">
                        <div class="kpi-card">
                            <span class="text-muted small fw-semibold text-uppercase">Contract Ceiling</span>

                            <small class="text-muted">26.7% Capital Utilized</small>

                <div class="card-widget p-4">
                    <h5 class="fw-bold text-dark mb-3">Invoice Approvals & 3-Way Match Audit</h5>
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>PO Ref</th>
                                    <th>Supplier</th>
                                    <th>PO Value</th>
                                    <th>Invoice Status</th>

            try {
                const orders = await API.getOrders();

                    tbody.innerHTML = orders.map(o => {
                        let matchStatusHtml = '';
                        let payActionHtml = '';

                        if (o.status === 'Completed') {
                            matchStatusHtml = `<span class="status-chip delivered"><i class="bi bi-check2-all"></i> Cleared & Paid</span>`;

                            matchStatusHtml = `<span class="status-chip ordered"><i class="bi bi-receipt"></i> Invoice: ${o.invoice_number || 'Submitted'}</span>`;

                            matchStatusHtml = `<span class="status-chip pending"><i class="bi bi-truck"></i> In Transit to Dock</span>`;

                console.error("Error loading finance orders:", err);

        // ==========================================
        // 4. SUPPLY CHAIN MANAGER DASHBOARD
        // ==========================================
        async function renderSupplyChainDashboard(mount) {
            mount.innerHTML = `

        document.getElementById('createPOForm').addEventListener('submit', async (e) => {

            const btn = document.getElementById('savePOBtn');
            btn.disabled = true;
            btn.textContent = 'Generating...';

            const payload = {
                title: document.getElementById('poTitle').value,
                vendor_id: parseInt(document.getElementById('poVendorSelect').value),
                total_amount: parseFloat(document.getElementById('poAmount').value),
                expected_delivery_date: document.getElementById('poDeliveryDate').value

            try {
                await API.createOrder(payload);
                bootstrap.Modal.getInstance(document.getElementById('newPOModal')).hide();
                document.getElementById('createPOForm').reset();
                renderDashboardForRole(localStorage.getItem('user_role'));

            } finally {
                btn.disabled = false;
