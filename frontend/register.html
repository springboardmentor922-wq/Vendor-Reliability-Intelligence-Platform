<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VendorIQ</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=rbac2">
</head>
<body style="background-color: var(--body-bg); min-height: 100vh; position: relative; overflow-x: hidden;">

    <!-- Ambient Mesh Lighting -->
    <div class="ambient-glow-mesh">
        <div class="ambient-blob-1"></div>
        <div class="ambient-blob-2"></div>
    </div>

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5 position-relative" style="z-index: 2;">
        <div class="w-100" style="max-width: 480px;">
            
            <div class="mb-3 text-start">
                <a href="index.html" class="btn btn-light btn-sm px-3 d-inline-flex align-items-center gap-2" style="border-radius: 9999px;">
                    <i class="bi bi-arrow-left"></i> <span>Back to Sign In</span>
                </a>
            </div>

            <div class="card-widget p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h3 class="fw-bold text-dark tracking-tight mb-1">Create Account</h3>
                    <p class="text-muted small">Register for the VendorIQ Intelligence Platform</p>
                </div>
                
                <div id="alertBox" class="alert d-none py-2 small" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label small fw-semibold text-secondary">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-color: var(--border-color);"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="fullName" required placeholder="John Doe">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">Work Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-color: var(--border-color);"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" required placeholder="name@company.com">
                        </div>
                        <div class="text-muted mt-1" style="font-size: 0.75rem;">Your email will serve as your secure login username.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted" style="border-color: var(--border-color);"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="alert alert-light border small text-muted mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-shield-check text-primary fs-5"></i>
                        <div style="font-size: 0.78rem;">
                            Role-based access permissions are automatically verified and assigned by the database upon registration.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold mt-2">
                        <span id="btnText">Create Account</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-1">
                    <p class="text-muted small m-0">Already have an account? <a href="index.html" class="fw-semibold text-primary text-decoration-none">Sign in here</a></p>
                </div>
            </div>

        </div>
    </div>

    <!-- Auth JS -->
    <script src="js/auth.js?v=rbac2"></script>
    <script>
        // Check if already authenticated and redirect
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfAuthenticated();
        });

        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show spinner
            btnText.textContent = 'Creating account...';
            btnSpinner.classList.remove('d-none');
            alertBox.className = 'alert d-none'; // Clear error classes

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await register(email, password, fullName);
                
                // Show success message
                alertBox.textContent = 'Account created successfully! Redirecting to login...';
                alertBox.className = 'alert alert-success';
                
                // Redirect to login after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (err) {
                // Show error
                alertBox.textContent = err.message;
                alertBox.className = 'alert alert-danger';
                
                // Reset button
                btnText.textContent = 'Create Account';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
