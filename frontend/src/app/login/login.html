<div class="login-page">
  <div class="auth-card">
    <!-- Brand Header -->
    <div class="card-brand">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/>
      </svg>
      <span class="brand-text">VendorIQ Enterprise</span>
    </div>

    <!-- Segmented Tab Switcher -->
    <div class="tab-switcher">
      <button 
        type="button" 
        [class.active]="activeTab === 'signin'" 
        (click)="setTab('signin')">
        Sign In
      </button>
      <button 
        type="button" 
        [class.active]="activeTab === 'signup'" 
        (click)="setTab('signup')">
        Create Account
      </button>
    </div>

    <!-- Sign In Tab Content -->
    <div *ngIf="activeTab === 'signin'" class="auth-form-container">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Access your Infosys vendor management portal</p>
      </div>

      <form (ngSubmit)="onSignIn()">
        <div class="form-group">
          <label>CORPORATE EMAIL</label>
          <input 
            type="email" 
            [(ngModel)]="signInData.email" 
            name="signInEmail" 
            placeholder="name@company.com" 
            required>
        </div>

        <div class="form-group">
          <label>PASSWORD</label>
          <input 
            type="password" 
            [(ngModel)]="signInData.password" 
            name="signInPassword" 
            required>
        </div>

        <button type="submit" class="btn-primary-action">Sign In to Workspace</button>
      </form>
    </div>

    <!-- Create Account Tab Content -->
    <div *ngIf="activeTab === 'signup'" class="auth-form-container">
      <div class="form-header">
        <h2>Register Account</h2>
        <p>Provision new user credentials for VendorIQ</p>
      </div>

      <form (ngSubmit)="onSignUp()">
        <div class="form-group">
          <label>FULL NAME</label>
          <input 
            type="text" 
            [(ngModel)]="signUpData.fullName" 
            name="signUpFullName" 
            placeholder="Full Name" 
            required>
        </div>

        <div class="form-group">
          <label>CORPORATE EMAIL</label>
          <input 
            type="email" 
            [(ngModel)]="signUpData.email" 
            name="signUpEmail" 
            placeholder="name@company.com" 
            required>
        </div>

        <div class="form-group">
          <label>ASSIGNED SYSTEM ROLE</label>
          <select [(ngModel)]="signUpData.role" name="signUpRole">
            <option value="Procurement Lead">Procurement Lead</option>
            <option value="Procurement Manager">Procurement Manager</option>
            <option value="Vendor Auditor">Vendor Auditor</option>
            <option value="System Administrator">System Administrator</option>
          </select>
        </div>

        <button type="submit" class="btn-primary-action">Complete Registration</button>
      </form>
    </div>
  </div>
</div>
