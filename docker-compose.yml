version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vendoriq_db
    restart: always
    environment:
      POSTGRES_USER: vendoriq_user
      POSTGRES_PASSWORD: vendoriq_password
      POSTGRES_DB: vendoriq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendoriq_user -d vendoriq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vendoriq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendoriq_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://vendoriq_user:vendoriq_password@db:5432/vendoriq_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-jwt-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendoriq_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: