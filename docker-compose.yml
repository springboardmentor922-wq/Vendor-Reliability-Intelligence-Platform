version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vendoriq_postgres
    restart: always
    environment:
      POSTGRES_USER: vendoriq
      POSTGRES_PASSWORD: vendoriq_password
      POSTGRES_DB: vendoriq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendoriq -d vendoriq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendoriq_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vendoriq:vendoriq_password@db:5432/vendoriq_db
      - SECRET_KEY=super-secret-jwt-key-for-vendoriq-risk-management-platform
      - CORS_ORIGINS=["*"]
      - PROJECT_NAME=VendorIQ – Vendor Reliability Platform
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendoriq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

