version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendor_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vendor_reliability_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendor_reliability_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendor_platform_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vendor_reliability_db
      SECRET_KEY: super-secret-key-change-in-production-vendor-reliability-platform
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "http://localhost:4200,http://127.0.0.1:4200"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendor_platform_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
