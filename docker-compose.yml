version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: procurahub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: vendor_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurahub-backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:password@db:3306/vendor_db
      SECRET_KEY: supersecretkeyforjwtverificationprocurahub2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procurahub-frontend
    restart: always
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  mysql_data:
