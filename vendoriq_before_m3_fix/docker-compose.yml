version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendoriq
      POSTGRES_PASSWORD: vendoriq
      POSTGRES_DB: vendoriq
    ports:
      - "5432:5432"
    volumes:
      - vendoriq_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://vendoriq:vendoriq@db:5432/vendoriq
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  vendoriq_pg_data:
