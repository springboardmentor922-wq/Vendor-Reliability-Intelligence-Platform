<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-0b1f9273-297a-41bc-892f-db7238a0455e/styles.css">
  <script src="_ds/modernist-0b1f9273-297a-41bc-892f-db7238a0455e/_ds_bundle.js"></script>
</helmet>
<div style="width:248px;flex:none;display:flex;flex-direction:column;background:{{ shellBg }};color:{{ shellFg }};border-right:2px solid var(--color-divider)">
  <div style="display:flex;align-items:center;gap:10px;padding:19px 20px;border-bottom:2px solid {{ ruleColor }}">
    <div style="width:22px;height:22px;flex:none;background:var(--color-accent)"></div>
    <div style="font-family:var(--font-heading);font-weight:800;font-size:19px;letter-spacing:-0.01em">VendorIQ</div>
  </div>
  <nav style="display:flex;flex-direction:column;padding:10px 0">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="10">
      <a href="{{ it.href }}" style="display:flex;align-items:center;gap:12px;padding:9px 20px;text-decoration:none;font-size:13.5px;border-left:3px solid {{ it.bar }};background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }}">
        <span style="font-size:10px;letter-spacing:0.08em;opacity:0.55">{{ it.num }}</span>
        <span>{{ it.label }}</span>
      </a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:16px 20px;border-top:2px solid {{ ruleColor }};font-size:11px;line-height:1.5;opacity:0.62">
    <span>{{ user }}</span>
    <span>Northbridge Manufacturing</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;vendors&quot;,&quot;procurement&quot;,&quot;po&quot;,&quot;performance&quot;,&quot;analytics&quot;,&quot;contracts&quot;,&quot;reports&quot;,&quot;notifications&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ink&quot;,&quot;light&quot;],&quot;default&quot;:&quot;ink&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;user&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A. Okonkwo · Procurement Lead&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'dashboard';
    const light = (this.props.theme || 'ink') === 'light';
    const items = [
      ['dashboard', 'Dashboard', '#f-dashboard', '01'],
      ['vendors', 'Vendors', '#f-vendors', '02'],
      ['procurement', 'Procurement', '#f-procurement', '03'],
      ['po', 'Purchase Orders', '#f-po', '04'],
      ['performance', 'Performance', '#f-performance', '05'],
      ['analytics', 'Analytics', '#f-analytics', '06'],
      ['contracts', 'Contracts', '#f-contracts', '07'],
      ['reports', 'Reports', '#f-reports', '08'],
      ['notifications', 'Notifications', '#f-notifications', '09'],
      ['settings', 'Settings', '#f-profile', '10']
    ];
    const idle = light ? 'color-mix(in srgb, var(--color-text) 72%, transparent)' : 'rgba(243,242,242,0.68)';
    return {
      shellBg: light ? 'var(--color-neutral-100)' : 'var(--color-text)',
      shellFg: light ? 'var(--color-text)' : 'var(--color-bg)',
      ruleColor: light ? 'var(--color-divider)' : 'rgba(243,242,242,0.26)',
      user: this.props.user || 'A. Okonkwo · Procurement Lead',
      items: items.map(([key, label, href, num]) => ({
        label: label,
        href: href,
        num: num,
        color: key === active ? 'var(--color-accent)' : idle,
        bar: key === active ? 'var(--color-accent)' : 'transparent',
        bg: key === active ? 'color-mix(in srgb, var(--color-accent) 12%, transparent)' : 'transparent',
        weight: key === active ? 800 : 400
      }))
    };
  }
}
</script>
</body>
</html>
