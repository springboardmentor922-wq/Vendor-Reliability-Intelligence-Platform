<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-0b1f9273-297a-41bc-892f-db7238a0455e/styles.css">
  <script src="_ds/modernist-0b1f9273-297a-41bc-892f-db7238a0455e/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;align-items:center;gap:16px;flex:none;height:64px;padding:0 24px;background:var(--color-neutral-100);border-bottom:2px solid var(--color-divider)">
  <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
    <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600)">{{ crumb }}</div>
    <div style="font-family:var(--font-heading);font-weight:800;font-size:20px;line-height:1.1;white-space:nowrap">{{ title }}</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <label style="display:flex;align-items:center;gap:8px;width:260px;height:36px;padding:0 10px;background:var(--color-bg);border:1px solid var(--color-divider)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.55;flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4.5-4.5"></path></svg>
      <input class="input" placeholder="Search vendors, POs, contracts" style="border:0;background:transparent;padding:0;min-height:0;font-size:12.5px">
    </label>
    <a href="#f-notifications" class="btn btn-secondary" style="width:36px;height:36px;padding:0;justify-content:center;position:relative">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span style="position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:var(--color-accent)"></span>
    </a>
    <a href="#f-profile" style="display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;padding-left:12px;border-left:1px solid var(--color-divider)">
      <div style="width:32px;height:32px;background:var(--color-text);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-weight:800;font-size:12px">AO</div>
      <div style="display:flex;flex-direction:column;line-height:1.25">
        <span style="font-size:12.5px;font-weight:600">{{ userName }}</span>
        <span style="font-size:10.5px;color:var(--color-neutral-600)">{{ userRole }}</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.5"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1192,&quot;height&quot;:64},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;VendorIQ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Adaeze Okonkwo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userRole&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Procurement Lead&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      crumb: this.props.crumb || 'VendorIQ',
      title: this.props.title || 'Dashboard',
      userName: this.props.userName || 'Adaeze Okonkwo',
      userRole: this.props.userRole || 'Procurement Lead'
    };
  }
}
</script>
</body>
